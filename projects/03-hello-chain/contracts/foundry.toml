[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Halmos cannot execute the vm.deployCode calls that dynamic test linking injects into tests
dynamic_test_linking = false
# Scripts record and read deployed addresses in deployments/<chainId>.json
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256
# Seeded for reproducible local runs. TOML cannot unset a key in a derived profile, so the ci profile
# inherits this; the CI workflow overrides it with a fresh random --fuzz-seed per run (and prints it).
seed = "0x1"

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[profile.ci]
fuzz = { runs = 10000 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
